name: Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI dependencies
        run: npm install

      - name: Install React dependencies
        run: npm --prefix frontend install

      - name: Prepare app icons
        shell: powershell
        run: |
          ./scripts/prepare-icon.ps1
          npx tauri icon src-tauri/icons/icon.png

      - name: Prepare bundled FFmpeg
        shell: powershell
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Build and publish VideoDowngrade
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'VideoDowngrade v__VERSION__'
          releaseBody: |
            VideoDowngrade v0.2.6 — color degradation.

            - new Color retention control from 100% color to full monochrome
            - color loss is applied to the real exported video through FFmpeg
            - Messenger preset gets subtle fading
            - Bad phone preset is noticeably desaturated
            - Destroyed preset now reaches black and white
            - preserves Original / Processed comparison preview
            - React + Tauri 2 + Rust
            - bundled FFmpeg / FFprobe
          releaseDraft: false
          prerelease: true
          args: --bundles nsis
          assetNamePattern: 'VideoDowngrade_[version]_Windows_x64[setup][ext]'
