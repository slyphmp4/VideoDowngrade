name: Windows Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI dependencies
        run: npm install

      - name: Install React dependencies
        run: npm --prefix frontend install

      - name: Prepare app icons
        shell: powershell
        run: |
          ./scripts/prepare-icon.ps1
          npx tauri icon src-tauri/icons/icon.png

      - name: Prepare bundled FFmpeg
        shell: powershell
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Build and publish VideoDowngrade
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'VideoDowngrade v__VERSION__'
          releaseBody: |
            First native Windows desktop build of VideoDowngrade.

            - React + Tauri 2 interface
            - native Rust processing core
            - bundled FFmpeg / FFprobe
            - local-only file processing
            - NSIS Windows installer
          releaseDraft: false
          prerelease: true
          args: --bundles nsis
          assetNamePattern: 'VideoDowngrade_[version]_Windows_x64[setup][ext]'
