[package]
name = "videodowngrade"
version = "0.2.3"
description = "A desktop video and audio degradation lab"
authors = ["slyphmp4"]
edition = "2021"

[lib]
name = "videodowngrade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
